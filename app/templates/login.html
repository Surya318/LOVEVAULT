{% extends "base.html" %}

{% block title %}Login - LoveVault ❤️{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="auth-card card p-4 shadow-sm">
        <div class="card-body">
            <h2 class="text-center mb-4 form-title">Welcome Back ❤️</h2>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill">Login</button>
                </div>
            </form>
            <div class="text-center mt-4">
                <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none custom-link">Create one</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
